name: AI Code Review

on:
  repository_dispatch:
    types: [review-requested]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tool
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: code-review-board
        run: pip install -r requirements.txt

      - name: Check GitHub token
        env:
          GITHUB_TOKEN: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::TARGET_REPO_PAT is missing or unavailable"
            exit 1
          fi
          echo "GitHub token is configured"

      - name: Run review pipeline
        working-directory: code-review-board
        env:
          COMMENTER_LLM: ${{ secrets.COMMENTER_LLM }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.TARGET_REPO_PAT }}
        run: |
          python run_pipeline.py \
            --owner "${{ github.event.client_payload.owner }}" \
            --repo "${{ github.event.client_payload.repo }}" \
            --pr "${{ github.event.client_payload.pr_number }}"